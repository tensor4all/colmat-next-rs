name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, not on pull requests or pushes: see the macOS rows / `if:` below.
  schedule:
    - cron: "43 17 * * *"   # 17:43 UTC = 02:43 JST, daily; off the :00/:30 herd
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One total wall-clock budget for the whole pipeline (CONTRIBUTING.md, "CI time budget").
  # Do not raise it, or add a per-job timeout, to make a slow addition fit: move the slow
  # test to heavy-tests.yml instead.
  CI_BUDGET_MINUTES: 15

jobs:
  # Detects the workspace. Without a `Cargo.toml` the Rust gates are skipped, and this job says so.
  rust:
    name: rust
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet: the Rust gates (fmt, clippy, test, msrv, docs, deny) are skipped."
          fi

  fmt:
    name: fmt
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-toolchain.toml`, which selects this toolchain for cargo.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # # macOS rows exist only on the daily schedule and on manual dispatch (workflow_dispatch), not on pull
        # requests or pushes: macOS runners are the organization's most expensive Actions SKU (November 2026:
        # about $1,480 list price across tensor4all, 57% of Actions cost) and the Team plan allows five
        # concurrent macOS jobs across the organization.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --profile ci

  msrv:
    name: msrv
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml. `RUSTUP_TOOLCHAIN` overrides
      # `rust-toolchain.toml`, which would otherwise select the pinned lint toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.89"

  docs:
    name: docs
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  deny:
    name: deny (bans, features)
    needs: rust
    if: ${{ needs.rust.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `deny.toml` lets `threadteam` (and the rayon it wraps) into the workspace, through
      # colmat-core's `threadteam` feature only (#20). `colmat-traits` has neither at all, and
      # `colmat-core` has neither without that feature (design record §2, principle 3).
      - name: No thread pool below colmat-core's execution layer
        run: |
          set -euo pipefail
          check() {
            found=$(cargo tree "$@" -e normal,build,dev --prefix none \
              | awk '{print $1}' | grep -xE 'rayon|rayon-core|threadteam' | sort -u || true)
            if [ -n "$found" ]; then
              echo "::error::cargo tree $* depends on: $found"
              exit 1
            fi
          }
          check -p colmat-traits --all-features
          check -p colmat-core --no-default-features
          check -p colmat-core --no-default-features --features std
      # The feature combinations the gates above do not build: no `std` (and so no team), and
      # `std` without the parallel route.
      - name: colmat-core without std, and without threadteam
        run: |
          set -euo pipefail
          cargo check -p colmat-core --no-default-features
          cargo clippy -p colmat-core --all-targets --no-default-features --features std -- -D warnings

  budget:
    name: budget
    needs: [rust, fmt, clippy, test, msrv, docs, deny]
    # The budget is for the PR pipeline; the scheduled run adds a cold macOS build and is not held to it.
    if: ${{ always() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Whole pipeline within CI_BUDGET_MINUTES
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          started=$(gh api "$run" --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Slowest jobs (seconds):"
          gh api "$run/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" --jq \
            '.jobs[] | select(.completed_at != null)
             | "\((.completed_at | fromdate) - (.started_at | fromdate))\t\(.name)"' \
            | sort -rn | head -5
          limit=$(( CI_BUDGET_MINUTES * 60 ))
          echo "Pipeline: ${elapsed}s of ${limit}s"
          if [ "$elapsed" -gt "$limit" ]; then
            echo "::error::CI pipeline took ${elapsed}s, over the ${limit}s budget. Move the slowest tests to heavy-tests.yml."
            exit 1
          fi

  # The single required status check for `main` (branch protection). Matrix job names change
  # between "skipped" and "ran" (`test (${{ matrix.os }})` vs `test (ubuntu-latest)`), so branch
  # protection names this job instead of the individual gates. Skipped gates count as passed.
  ci-gate:
    name: ci-gate
    needs: [rust, fmt, clippy, test, msrv, docs, deny, budget]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi

  # Only the scheduled run has macOS rows, so a failure there is the macOS signal PR CI no longer
  # gives. One rolling issue, found by title. Manual dispatches report in the run only.
  report:
    name: Report a failing night
    needs: [test]
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label=ci-nightly
          title="Scheduled macOS nightly is failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n' \
            "The scheduled CI run (the only one with macOS rows) failed in [run ${GITHUB_RUN_ID}](${run_url}) on \`${GITHUB_SHA:0:8}\`." \
            "PR CI no longer runs on macOS; dispatch \`ci.yml\` on a fix branch (\`workflow_dispatch\`) to verify it."
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "Scheduled macOS nightly" 2>/dev/null || true
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open \
            --search "in:title \"$title\"" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" --title "$title" --body "$body"
          fi
