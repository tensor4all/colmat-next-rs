name: Heavy tests

# Scheduled home for work too expensive for the push/PR pipeline (CONTRIBUTING.md,
# "CI time budget"): tests named `heavy_*` and marked `#[ignore = "heavy: ..."]`,
# and every example and bench target. This workflow carries its own bound below.

# Two schedules (#31). Each job below names the one it runs on, through `github.event.schedule`:
# - nightly: `heavy` and `kani`;
# - weekly (Sunday): `miri` and `miri-tree-borrows`, the two longest jobs (12 and 35 runner
#   minutes on 2026-11-23, run 45236189147, against a 60-minute timeout).
# `workflow_dispatch` runs every job, so Miri can be run on a branch before it merges:
# `gh workflow run heavy-tests.yml --ref <branch>`.
on:
  schedule:
    # 18:00 UTC = 03:00 JST. Keep these strings in step with the `if:` of each job.
    - cron: "0 18 * * *"
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: heavy-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heavy:
    name: Heavy tests
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 18 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      # Until the first crate lands there is no workspace; the run is a no-op, not a failure.
      - name: Build every target
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo build --profile ci --workspace --all-targets
      - name: Run heavy tests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test --workspace --profile ci -- --ignored heavy_
      # The property tests (`prop_*`) run 256 cases in the PR pipeline; this job runs many more.
      - name: Property tests, many cases
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          PROPTEST_CASES: "65536"
        run: cargo test --workspace --profile ci prop_

  # Undefined behaviour in the unsafe code: the data movement of `colmat-traits` (masked and pair
  # loads and stores, slice reinterpretation) and the views of `colmat-core` (raw-pointer views,
  # splits, owned-matrix allocation, `zip!`). Weekly (#31) and on dispatch, and slower than the PR
  # budget allows.
  # Two jobs, one per aliasing model Miri implements (#16): Stacked Borrows (the default) and Tree
  # Borrows. A pattern can be UB under one and not the other; each job fits its own timeout.
  miri:
    name: Miri, Stacked Borrows (colmat-traits, colmat-core)
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 18 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri over the lib tests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RUSTUP_TOOLCHAIN: nightly
          # proptest reads the working directory (failure persistence) and its default ChaCha RNG
          # uses SIMD intrinsics Miri does not implement on every target; XorShift is plain Rust.
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_RNG_ALGORITHM: xs
          PROPTEST_CASES: "16"
        run: cargo miri test -p colmat-traits -p colmat-core --lib
      # The doctests call the public entry points the way a user writes them.
      - name: Miri over the doctests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RUSTUP_TOOLCHAIN: nightly
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test -p colmat-traits -p colmat-core --doc

  miri-tree-borrows:
    name: Miri, Tree Borrows (colmat-traits, colmat-core)
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 18 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri over the lib tests and doctests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RUSTUP_TOOLCHAIN: nightly
          # As in `miri`; see there.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
          PROPTEST_RNG_ALGORITHM: xs
          PROPTEST_CASES: "16"
        run: |
          cargo miri test -p colmat-traits -p colmat-core --lib
          cargo miri test -p colmat-traits -p colmat-core --doc

  # Kani proofs (#17, a trial): the index arithmetic behind colmat-core's unsafe blocks, proved for
  # every input within each harness's bound (`crates/colmat-core/src/kani_proofs.rs`). Kani does not
  # model unwinding or Stacked/Tree Borrows, which stay with the Miri jobs above. The version is
  # pinned so that a new Kani release cannot change the result on its own.
  # arm64, not x86-64 (#21): on x86-64 `pulp`'s build script emits a `global_asm!` block (masked
  # AVX load/store stubs), which Kani refuses to build. aarch64 has none, and the index arithmetic
  # under proof has no architecture-specific code, so no `--ignore-global-asm` is needed.
  kani:
    name: Kani proofs (colmat-core)
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 18 * * *' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Kani proofs
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo kani -p colmat-core

  # A separate job, because a run that dies on the timeout never reaches a later step.
  # It runs after every scheduled run, nightly or weekly. A job the schedule left out has the
  # result `skipped`, which the condition below does not match, so only a job that ran and
  # failed (or was cancelled) files a report.
  # One rolling issue, found by its title: later failing runs comment on it instead of filing a
  # new one. No label is used, because the repository has none yet (PR #3, point 5).
  report:
    name: Report a failing scheduled run
    needs: [heavy, miri, miri-tree-borrows, kani]
    if: >-
      ${{ always() && (needs.heavy.result == 'failure' || needs.heavy.result == 'cancelled'
      || needs.miri.result == 'failure' || needs.miri.result == 'cancelled'
      || needs.miri-tree-borrows.result == 'failure'
      || needs.miri-tree-borrows.result == 'cancelled'
      || needs.kani.result == 'failure' || needs.kani.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Scheduled heavy tests are failing
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n\n%s\n' \
            "Automated post from the \`heavy-tests\` workflow (no model involved). The scheduled heavy suite failed in [run ${GITHUB_RUN_ID}](${run_url}) on \`${GITHUB_SHA:0:8}\`." \
            "Reproduce locally: \`cargo test --workspace --profile ci -- --ignored heavy_\`; Miri (\`miri\` job, and with \`-Zmiri-tree-borrows\` added for \`miri-tree-borrows\`): \`MIRIFLAGS=-Zmiri-disable-isolation PROPTEST_RNG_ALGORITHM=xs PROPTEST_CASES=16 cargo +nightly miri test -p colmat-traits -p colmat-core --lib\` and the same with \`--doc\`; Kani: \`cargo kani -p colmat-core\` (kani-verifier 0.68.0)" \
            "Heavy tests run outside the push/PR pipeline on purpose. Treat this as a real regression, or as a change that pushed a test past this workflow's bound."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --limit 20 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
