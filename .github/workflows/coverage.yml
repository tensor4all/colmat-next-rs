name: Coverage

# Line coverage (#37), not a merge gate: not part of `ci-gate`. The job fails below the floor,
# 58.9 % of lines (`--fail-under-lines`), which is set below the `ubuntu-latest` baseline of
# 8484 or 8488 lines, so a runner of either instruction set passes with a margin (#37).
# Doctests are not measured. `docs/coverage.md` has the command, the baseline and the floor.

on:
  schedule:
    # Sunday 20:00 UTC = Monday 05:00 JST, after the weekly Miri and mutants runs start.
    - cron: "0 20 * * 0"
  workflow_dispatch:
  # A pull request that changes this workflow runs it once, so that it is checked before it
  # reaches `main` (where `workflow_dispatch` becomes available).
  pull_request:
    paths:
      - .github/workflows/coverage.yml

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage (report)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # The action tag moves; the tool it installs is the pinned part.
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      # `--test-threads=1`: with the default threads the tests of one binary contend on the shared
      # coverage counters, and the run takes about 21 minutes instead of about 3 (#37). The table
      # goes to the log and to the job summary, with the commit it measured.
      # `PROPTEST_RNG_SEED` (the seed of `mutants.yml`) makes the property tests draw the same
      # inputs on every run, so the number does not move with them (#37). The `test` job of
      # `ci.yml` and the nightly 65 536-case run still draw new inputs.
      # The tests run once (`--no-report`); the per-line `lcov.info` and the summary are both
      # reports of that one run. `lcov.info` is written first, so that it is uploaded also when
      # the summary fails the floor: a run below it is compared line by line, not met by lowering
      # the floor (#37).
      - name: Line coverage
        env:
          PROPTEST_RNG_SEED: "20261120"
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --all-targets --locked --profile ci --no-report \
            -- --test-threads=1
          cargo llvm-cov report --profile ci --lcov --output-path lcov.info
          {
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```'
            cargo llvm-cov report --profile ci --summary-only --fail-under-lines 58.9
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The number still moved by a few lines between runs of one commit with the seed (#37).
      # Two runs whose numbers differ are compared through these files, to find the lines that
      # move, kept 14 days. Re-running all jobs left only the last attempt's artifact (#48), so
      # the runs compared are separate runs, not attempts (`docs/coverage.md`).
      - name: Upload lcov.info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: lcov.info
          retention-days: 14
          if-no-files-found: error
