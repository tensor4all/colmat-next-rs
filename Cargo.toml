[workspace]
members = ["crates/colmat-traits", "crates/colmat-core"]
resolver = "3"

[workspace.package]
edition = "2024"
# Keep in sync with the `msrv` job in `.github/workflows/ci.yml`.
rust-version = "1.89"
# MIT, chosen by the maintainers (#29); crates that port faer code also keep faer's MIT notice.
license = "MIT"
repository = "https://github.com/tensor4all/colmat-next-rs"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.24.0", default-features = false }
libm = { version = "0.2.15", default-features = false }
num-complex = { version = "0.4.6", default-features = false, features = ["bytemuck"] }
pulp = { version = "0.22.2", default-features = false }
paste = "1.0.15"
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false }
dyn-stack = { version = "0.13.2", default-features = false, features = ["core-error", "alloc"] }
equator = "0.6.0"
generativity = "1.1.0"
reborrow = "0.5.5"
# Native kernels of the matrix product (#23): small products (MIT).
nano-gemm = { version = "0.2.2", default-features = false }
# Native kernels of the matrix product (#23): packed products (MIT; the tensor4all fork of `gemm`,
# library name `gemm`, as in colmat-rs). `t4a-gemm-common` is named only to require 0.20.4, the
# release without a per-call allocation of the packing flags (colmat-rs `faer/Cargo.toml`).
gemm = { package = "t4a-gemm", version = "0.20.1", default-features = false }
t4a-gemm-common = { version = "0.20.4", default-features = false }
# x86-64 packed products (MIT; the tensor4all fork of `private-gemm-x86`).
t4a-private-gemm-x86 = { version = "0.1.28", default-features = false }
# The only crate that starts threads (`deny.toml`); its default `parallel` feature brings rayon.
threadteam = "0.6.0"

# Each lint names the failure it prevents (AGENTS.md, "Proportionate safety and validation").
[workspace.lints.rust]
# An `unsafe fn` body would otherwise hide which operations are unsafe.
unsafe_op_in_unsafe_fn = "deny"
# Public items without documentation (denied in CI through `-D warnings`).
missing_docs = "warn"
# `cfg(kani)` gates the Kani proof harnesses (#17).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# An unsafe block without a `// SAFETY:` proof cannot be reviewed against its contract.
undocumented_unsafe_blocks = "deny"
# An `unsafe fn` or `unsafe trait` without a `# Safety` section has no contract to uphold.
missing_safety_doc = "deny"

# `cargo test --profile ci` (CONTRIBUTING.md, "Local gate"): optimised enough for the numerical
# tests, with debug assertions and overflow checks kept on.
[profile.ci]
inherits = "test"
opt-level = 2
debug = "line-tables-only"

# The `gemm_with_stack` entries of the packed kernels (#34), merged upstream but not yet released:
# pinned by git revision, all in this table. `cargo deny` checks bans only, and the workspace is
# not published, so a git source builds here.
[patch.crates-io]
# TODO(#34): move to the crates.io release of t4a-gemm that contains tensor4all/t4a-gemm#22.
t4a-gemm = { git = "https://github.com/tensor4all/t4a-gemm", rev = "29b5b467c5f7147a9a14ae00613c7f848d0505a5" }
# TODO(#34): as `t4a-gemm` (the same repository and revision).
t4a-gemm-common = { git = "https://github.com/tensor4all/t4a-gemm", rev = "29b5b467c5f7147a9a14ae00613c7f848d0505a5" }
# TODO(#34): move to the crates.io release of t4a-private-gemm-x86 that contains
# tensor4all/t4a-private-gemm-x86#20 and #21.
t4a-private-gemm-x86 = { git = "https://github.com/tensor4all/t4a-private-gemm-x86", rev = "d518bab95062e2003a2fc4de5481ea99bda984a2" }
