[package]
name = "colmat-core"
version = "0.0.0"
description = "Matrix views, iteration, layout copies and the execution layer (Par, team skeletons, cost model, workspace) for colmat-next (trial)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
colmat-traits = { path = "../colmat-traits", default-features = false }
num-complex.workspace = true
bytemuck.workspace = true
dyn-stack.workspace = true
equator.workspace = true
generativity.workspace = true
reborrow.workspace = true
threadteam = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = ["std", "threadteam"]
std = ["colmat-traits/std", "num-complex/std", "dyn-stack/std"]
# The parallel route: `Par::Team` runs its regions on a threadteam team (#20).
threadteam = ["std", "dep:threadteam"]

[lints]
workspace = true
